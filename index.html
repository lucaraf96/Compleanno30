<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Il Grimorio di Luca</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;

      font-family: Georgia, "Times New Roman", serif;
      color: #d8bd7a;

      background:
        radial-gradient(
          circle at 82% 12%,
          rgba(214, 129, 36, 0.34) 0%,
          rgba(214, 129, 36, 0.08) 12%,
          transparent 26%
        ),
        radial-gradient(
          circle at 20% 18%,
          rgba(120, 72, 25, 0.24) 0%,
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 45%,
          rgba(117, 78, 35, 0.22) 0%,
          transparent 47%
        ),
        linear-gradient(
          90deg,
          #050403 0%,
          #16100b 28%,
          #21170f 50%,
          #130d09 72%,
          #030302 100%
        );
    }

    .grimorio {
      position: relative;
      width: 760px;
      max-width: 94vw;
      padding: 44px 52px;
      text-align: center;

      background:
        linear-gradient(
          rgba(30, 25, 18, 0.96),
          rgba(12, 10, 8, 0.98)
        ),
        repeating-linear-gradient(
          45deg,
          rgba(255, 230, 170, 0.025) 0,
          rgba(255, 230, 170, 0.025) 1px,
          transparent 1px,
          transparent 8px
        );

      border: 2px solid rgba(176, 124, 50, 0.78);
      border-radius: 10px;

      box-shadow:
        0 0 45px rgba(0, 0, 0, 0.92),
        inset 0 0 45px rgba(0, 0, 0, 0.78),
        inset 0 0 20px rgba(184, 128, 55, 0.18);
    }

    .cornice {
      position: relative;
      padding: 34px 34px 28px;
      border: 1px solid rgba(171, 119, 48, 0.5);
    }

    .cornice::before,
    .cornice::after {
      content: "✦";
      position: absolute;
      left: 50%;
      padding: 0 10px;

      color: #a37739;
      background: #17120d;

      font-size: 18px;
      transform: translateX(-50%);
    }

    .cornice::before {
      top: -12px;
    }

    .cornice::after {
      bottom: -12px;
    }

    .ornamento {
      margin-bottom: 18px;
      color: #9f763e;
      font-size: 18px;
      letter-spacing: 8px;
    }

    h1 {
      margin: 0;

      color: #c99a45;
      font-size: clamp(42px, 7vw, 72px);
      font-weight: normal;
      line-height: 0.95;
