<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Lucchetto verticale</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px 10px;color:#fff;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#343434,#151515 45%,#050505)}.page{width:100%;max-width:520px;text-align:center}.eyebrow{margin-bottom:9px;color:#bbb;font-size:12px;font-weight:700;letter-spacing:4px;text-transform:uppercase}h1{margin-bottom:9px;font-size:clamp(30px,8vw,46px)}.instructions{margin-bottom:25px;color:#aaa;line-height:1.45}.lock-area{display:flex;flex-direction:column;align-items:center}.shackle{position:relative;z-index:1;width:180px;height:145px;margin-bottom:-38px;border:23px solid #b7b7b7;border-bottom:0;border-radius:95px 95px 0 0;box-shadow:inset 7px 0 7px #ffffff40,inset -7px 0 8px #0008,0 12px 25px #000a}.shackle:after{content:"";position:absolute;right:-23px;bottom:-8px;width:23px;height:62px;background:linear-gradient(90deg,#888,#ddd,#777)}.lock-body{position:relative;z-index:2;width:min(90vw,300px);padding:34px 22px 25px;border:1px solid #4b4b4b;border-radius:34px;background:linear-gradient(145deg,#303030,#101010 40%,#000);box-shadow:0 30px 60px #000c,inset 0 1px 1px #ffffff2b}.lock-body:before{content:"";position:absolute;top:12px;left:50%;width:75px;height:4px;border-radius:10px;background:#555;transform:translateX(-50%)}.wheels{display:flex;flex-direction:column;gap:9px}.wheel-row{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:7px}.arrow{width:44px;height:70px;border:0;border-radius:11px;color:#bbb;font-size:25px;cursor:pointer;background:transparent}.arrow:hover,.arrow:focus{color:#fff;background:#ffffff18;outline:none}.arrow:active{transform:scale(.9)}.wheel{position:relative;height:72px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:13px;border-top:1px solid #777;border-bottom:1px solid #777;background:linear-gradient(90deg,#111,#777 20%,#e2e2e2 49%,#858585 80%,#111);box-shadow:inset 13px 0 18px #000e,inset -13px 0 18px #000e}.wheel:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:#0005}.digit{position:relative;z-index:1;color:#080808;font-size:52px;font-weight:900;text-shadow:0 1px #fff;user-select:none}.digit.change{animation:change .18s ease}.open-button{width:100%;margin-top:21px;padding:15px 8px;border:0;border-radius:15px;color:#050505;font-size:14px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase;cursor:pointer;background:#fff}.message{min-height:22px;margin-top:14px;color:#777;font-size:14px;font-weight:700}.message.error{color:#ff6969}.shake{animation:shake .45s}.success{display:none;padding:48px 22px;border:1px solid #34d39959;border-radius:34px;background:#10b9811a;box-shadow:0 25px 80px #10b98133;animation:success .6s}.success-icon{width:110px;height:110px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;border-radius:50%;color:#052e25;font-size:58px;background:#34d399;box-shadow:0 0 45px #34d39988}.success-label{margin-bottom:12px;color:#6ee7b7;font-size:12px;font-weight:900;letter-spacing:4px;text-transform:uppercase}.success h2{font-size:clamp(38px,10vw,60px);line-height:1}.success p{margin-top:17px;color:#d1d5db}@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}@keyframes change{from{transform:translateX(-12px);opacity:.3}}@keyframes success{from{opacity:0;transform:scale(.78)}}@media(max-height:800px){body{align-items:flex-start}}@media(max-width:360px){.lock-body{padding-left:16px;padding-right:16px}.wheel-row{grid-template-columns:40px 1fr 40px;gap:4px}.arrow{width:40px}}
</style>
</head>
<body>
<main class="page">
<section id="lockScreen">
<div class="eyebrow">Accesso protetto</div><h1>Trova la combinazione</h1><p class="instructions">Usa le frecce laterali per ruotare le quattro cifre.</p>
<div class="lock-area" id="lockArea"><div class="shackle"></div><div class="lock-body"><div class="wheels" id="wheels"></div><button class="open-button" id="openButton">Apri il lucchetto</button><p class="message" id="message">Inserisci una cifra in ogni spazio.</p></div></div>
</section>
<section class="success" id="successScreen"><div class="success-icon">✓</div><div class="success-label">Accesso consentito</div><h2>Lucchetto sbloccato</h2><p>La combinazione è corretta. Avete superato la prova.</p></section>
</main>
<script>
const correctCode=[5,0,3,1],digits=[0,0,0,0],wheels=document.getElementById('wheels'),lockArea=document.getElementById('lockArea'),lockScreen=document.getElementById('lockScreen'),successScreen=document.getElementById('successScreen'),message=document.getElementById('message');
function changeDigit(i,d){digits[i]=(digits[i]+d+10)%10;const el=document.getElementById('digit-'+i);el.textContent=digits[i];el.classList.remove('change');void el.offsetWidth;el.classList.add('change');message.textContent='Inserisci una cifra in ogni spazio.';message.classList.remove('error')}
digits.forEach((n,i)=>{const row=document.createElement('div');row.className='wheel-row';const left=document.createElement('button');left.className='arrow';left.innerHTML='◀';left.setAttribute('aria-label','Diminuisci cifra '+(i+1));left.onclick=()=>changeDigit(i,-1);const wheel=document.createElement('div');wheel.className='wheel';const digit=document.createElement('span');digit.className='digit';digit.id='digit-'+i;digit.textContent=n;wheel.appendChild(digit);const right=document.createElement('button');right.className='arrow';right.innerHTML='▶';right.setAttribute('aria-label','Aumenta cifra '+(i+1));right.onclick=()=>changeDigit(i,1);row.append(left,wheel,right);wheels.appendChild(row)});
document.getElementById('openButton').onclick=()=>{if(digits.every((n,i)=>n===correctCode[i])){lockScreen.style.display='none';successScreen.style.display='block'}else{message.textContent='Combinazione errata. Riprova.';message.classList.add('error');lockArea.classList.remove('shake');void lockArea.offsetWidth;lockArea.classList.add('shake')}};
</script>
</body>
</html>
