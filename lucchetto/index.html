<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Lucchetto a combinazione</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 14px; overflow-x: hidden; color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #343434 0%, #151515 45%, #050505 100%);
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    .page { width: 100%; max-width: 620px; text-align: center; }
    .eyebrow { margin-bottom: 10px; color: #bdbdbd; font-size: 13px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }
    h1 { margin-bottom: 10px; font-size: clamp(32px, 8vw, 52px); line-height: 1.05; }
    .instructions { margin-bottom: 34px; color: #aaa; font-size: 16px; line-height: 1.5; }
    .lock-area { position: relative; display: flex; flex-direction: column; align-items: center; }
    .shackle {
      position: relative; z-index: 1; width: 210px; height: 185px; margin-bottom: -48px;
      border: 25px solid #b7b7b7; border-bottom: 0; border-radius: 105px 105px 0 0;
      background: transparent;
      box-shadow: inset 7px 0 7px rgba(255,255,255,.25), inset -7px 0 8px rgba(0,0,0,.55), 0 12px 25px rgba(0,0,0,.65);
    }
    .shackle::after {
      content: ""; position: absolute; right: -25px; bottom: -8px; width: 25px; height: 75px;
      border-radius: 0 0 8px 8px; background: linear-gradient(90deg, #8f8f8f, #d1d1d1, #777);
    }
    .lock-body {
      position: relative; z-index: 2; width: min(94vw, 470px); padding: 34px 24px 26px;
      border: 1px solid #4b4b4b; border-radius: 35px;
      background: linear-gradient(145deg, #303030 0%, #101010 40%, #000 100%);
      box-shadow: 0 30px 60px rgba(0,0,0,.75), inset 0 1px 1px rgba(255,255,255,.17);
    }
    .lock-body::before {
      content: ""; position: absolute; top: 12px; left: 50%; width: 80px; height: 4px;
      border-radius: 10px; background: #555; transform: translateX(-50%);
    }
    .wheels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .wheel-column { display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .arrow {
      width: 100%; height: 42px; border: 0; border-radius: 10px; color: #bdbdbd;
      font-size: 25px; cursor: pointer; background: transparent;
      transition: background .15s ease, color .15s ease, transform .1s ease;
    }
    .arrow:hover, .arrow:focus-visible { color: #fff; outline: none; background: rgba(255,255,255,.1); }
    .arrow:active { transform: scale(.9); }
    .wheel {
      position: relative; width: 100%; height: 98px; display: flex; align-items: center; justify-content: center;
      overflow: hidden; border-right: 1px solid #777; border-left: 1px solid #777; border-radius: 12px;
      background: linear-gradient(to bottom, #111 0%, #777 25%, #e2e2e2 49%, #858585 76%, #111 100%);
      box-shadow: inset 0 12px 18px rgba(0,0,0,.9), inset 0 -12px 18px rgba(0,0,0,.9);
    }
    .wheel::after { content: ""; position: absolute; right: 0; left: 0; top: 50%; height: 2px; background: rgba(0,0,0,.34); transform: translateY(-50%); }
    .digit {
      position: relative; z-index: 1; color: #080808; font-size: clamp(45px, 12vw, 62px);
      font-weight: 900; line-height: 1; text-shadow: 0 1px 0 rgba(255,255,255,.85); user-select: none;
    }
    .digit.change { animation: digitChange .18s ease; }
    .open-button {
      width: 100%; margin-top: 23px; padding: 16px 12px; border: 0; border-radius: 15px;
      color: #050505; font-size: 15px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; background: #fff; box-shadow: 0 8px 18px rgba(0,0,0,.35);
      transition: transform .12s ease, background .15s ease;
    }
    .open-button:hover { background: #ddd; }
    .open-button:active { transform: scale(.98); }
    .message { min-height: 22px; margin-top: 15px; color: #777; font-size: 14px; font-weight: 700; }
    .message.error { color: #ff6969; }
    .shake { animation: shake .45s ease; }
    .success-screen {
      display: none; width: 100%; padding: 48px 24px; border: 1px solid rgba(52,211,153,.35);
      border-radius: 34px; background: rgba(16,185,129,.10); box-shadow: 0 25px 80px rgba(16,185,129,.2);
      animation: successIn .65s cubic-bezier(.2,.8,.2,1);
    }
    .success-icon {
      width: 112px; height: 112px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 25px; border-radius: 50%; color: #052e25; font-size: 58px;
      background: #34d399; box-shadow: 0 0 45px rgba(52,211,153,.55);
    }
    .success-label { margin-bottom: 12px; color: #6ee7b7; font-size: 13px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; }
    .success-screen h2 { font-size: clamp(38px, 10vw, 62px); line-height: 1; }
    .success-screen p { margin-top: 17px; color: #d1d5db; line-height: 1.5; }
    @keyframes shake {
      0%,100% { transform: translateX(0); } 20% { transform: translateX(-12px); }
      40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); }
    }
    @keyframes digitChange { from { transform: translateY(-12px); opacity: .25; } to { transform: translateY(0); opacity: 1; } }
    @keyframes successIn { from { opacity: 0; transform: scale(.78); } to { opacity: 1; transform: scale(1); } }
    @media (max-width: 440px) {
      body { padding: 16px 10px; }
      .instructions { margin-bottom: 24px; }
      .shackle { width: 170px; height: 150px; margin-bottom: -40px; border-width: 21px; }
      .shackle::after { right: -21px; width: 21px; height: 62px; }
      .lock-body { padding: 30px 14px 22px; border-radius: 28px; }
      .wheels { gap: 6px; }
      .wheel { height: 88px; }
      .arrow { height: 37px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section id="lockScreen">
      <div class="eyebrow">Accesso protetto</div>
      <h1>Trova la combinazione</h1>
      <p class="instructions">Ruota i quattro selettori e prova ad aprire il lucchetto.</p>
      <div class="lock-area" id="lockArea">
        <div class="shackle" aria-hidden="true"></div>
        <div class="lock-body">
          <div class="wheels" id="wheels"></div>
          <button class="open-button" id="openButton" type="button">Apri il lucchetto</button>
          <p class="message" id="message" aria-live="polite">Inserisci una cifra in ogni spazio.</p>
        </div>
      </div>
    </section>
    <section class="success-screen" id="successScreen" aria-live="polite">
      <div class="success-icon" aria-hidden="true">✓</div>
      <div class="success-label">Accesso consentito</div>
      <h2>Lucchetto sbloccato</h2>
      <p>La combinazione è corretta. Avete superato la prova.</p>
    </section>
  </main>
  <script>
    const correctCode = [5, 0, 3, 1];
    const digits = [0, 0, 0, 0];
    const wheelsContainer = document.getElementById('wheels');
    const lockArea = document.getElementById('lockArea');
    const lockScreen = document.getElementById('lockScreen');
    const successScreen = document.getElementById('successScreen');
    const message = document.getElementById('message');
    const openButton = document.getElementById('openButton');

    function createWheels() {
      digits.forEach((digit, index) => {
        const column = document.createElement('div');
        column.className = 'wheel-column';
        const upButton = document.createElement('button');
        upButton.type = 'button'; upButton.className = 'arrow'; upButton.innerHTML = '&#9650;';
        upButton.setAttribute('aria-label', `Aumenta la cifra ${index + 1}`);
        upButton.addEventListener('click', () => changeDigit(index, 1));
        const wheel = document.createElement('div'); wheel.className = 'wheel';
        const digitElement = document.createElement('span');
        digitElement.className = 'digit'; digitElement.id = `digit-${index}`; digitElement.textContent = digit;
        wheel.appendChild(digitElement);
        const downButton = document.createElement('button');
        downButton.type = 'button'; downButton.className = 'arrow'; downButton.innerHTML = '&#9660;';
        downButton.setAttribute('aria-label', `Diminuisci la cifra ${index + 1}`);
        downButton.addEventListener('click', () => changeDigit(index, -1));
        column.append(upButton, wheel, downButton); wheelsContainer.appendChild(column);
      });
    }

    function changeDigit(index, direction) {
      digits[index] = (digits[index] + direction + 10) % 10;
      const digitElement = document.getElementById(`digit-${index}`);
      digitElement.textContent = digits[index];
      digitElement.classList.remove('change'); void digitElement.offsetWidth; digitElement.classList.add('change');
      message.textContent = 'Inserisci una cifra in ogni spazio.'; message.classList.remove('error');
    }

    function tryToOpen() {
      const isCorrect = digits.every((digit, index) => digit === correctCode[index]);
      if (isCorrect) {
        lockScreen.style.display = 'none'; successScreen.style.display = 'block';
      } else {
        message.textContent = 'Combinazione errata. Riprova.'; message.classList.add('error');
        lockArea.classList.remove('shake'); void lockArea.offsetWidth; lockArea.classList.add('shake');
      }
    }

    openButton.addEventListener('click', tryToOpen);
    createWheels();
  </script>
</body>
</html>
