    <!-- SCHERMATA DI ACCESSO -->

    <main id="password-screen">
        <section class="password-box">

            <div class="symbol">🔐</div>

            <h1>Documento protetto</h1>

            <p class="description">
                Scrivi la soluzione per sbloccare il documento.
            </p>

            <input
                id="password-input"
                class="password-input"
                type="text"
                placeholder="Scrivi la soluzione..."
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                aria-label="Password di accesso"
            >

            <button
                id="unlock-button"
                class="unlock-button"
                type="button"
            >
                Sblocca il documento
            </button>

            <p id="error-message" aria-live="polite"></p>

        </section>
    </main>

    <!-- VISUALIZZATORE PDF -->

    <section id="pdf-screen">

        <header class="pdf-header">

            <p class="pdf-title">
                Documento sbloccato
            </p>

            enigma1.pdf
                Apri PDF
            </a>

        </header>

        <div class="pdf-container">

            <iframe
                id="pdf-frame"
                class="pdf-frame"
                title="Documento PDF"
            ></iframe>

        </div>

    </section>

    <script>
        const passwordInput =
            document.getElementById("password-input");

        const unlockButton =
            document.getElementById("unlock-button");

        const errorMessage =
            document.getElementById("error-message");

        const passwordScreen =
            document.getElementById("password-screen");

        const pdfScreen =
            document.getElementById("pdf-screen");

        const pdfFrame =
            document.getElementById("pdf-frame");

        /*
         * Questa funzione rende equivalenti:
         *
         * vorrei risolvere l'enigma
         * vorreirisolverel'enigma
         * vorreirisolverelenigma
         * Vorrei risolvere l'enigma
         * Vorreirisolverel'enigma
         * Vorreirisolverelenigma
         *
         * Vengono ignorati:
         * - maiuscole e minuscole
         * - spazi
         * - apostrofi normali e tipografici
         */

        function normalizePhrase(phrase) {
            return phrase
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/\s+/g, "")
                .replace(/['’`´]/g, "");
        }

        function unlockDocument() {
            const insertedPhrase =
                normalizePhrase(passwordInput.value);

            const correctPhrase =
                "vorreirisolverelenigma";

            if (insertedPhrase === correctPhrase) {

                errorMessage.textContent = "";

                passwordScreen.style.display = "none";
                pdfScreen.style.display = "block";

                /*
                 * Il PDF viene caricato solo dopo
                 * l'inserimento della frase corretta.
                 */

                pdfFrame.src = "enigma1.pdf";

            } else {

                errorMessage.textContent =
                    "La soluzione proposta non è corretta. Riprova.";

                passwordInput.value = "";
                passwordInput.focus();

                const box =
                    document.querySelector(".password-box");

                box.animate(
                    [
                        { transform: "translateX(0)" },
                        { transform: "translateX(-8px)" },
                        { transform: "translateX(8px)" },
                        { transform: "translateX(-5px)" },
                        { transform: "translateX(5px)" },
                        { transform: "translateX(0)" }
                    ],
                    {
                        duration: 350,
                        easing: "ease-in-out"
                    }
                );
            }
        }

        unlockButton.addEventListener(
            "click",
            unlockDocument
        );

        passwordInput.addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    unlockDocument();
                }
            }
        );

        window.addEventListener(
            "load",
            function() {
                passwordInput.focus();
            }
        );
    </script>
